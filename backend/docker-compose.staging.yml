name: azul-os-staging

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${STAGING_POSTGRES_DB:?Set STAGING_POSTGRES_DB in .env.staging}
      POSTGRES_USER: ${STAGING_POSTGRES_USER:?Set STAGING_POSTGRES_USER in .env.staging}
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:?Set STAGING_DB_PASSWORD in .env.staging}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STAGING_POSTGRES_USER} -d ${STAGING_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    networks:
      - staging

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgres://${STAGING_POSTGRES_USER}:${STAGING_DB_PASSWORD}@db:5432/${STAGING_POSTGRES_DB}
      JWT_SECRET: ${STAGING_JWT_SECRET:?Set STAGING_JWT_SECRET in .env.staging}
      CORS_ORIGINS: ${STAGING_CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - staging

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    env_file:
      - .env.staging
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${STAGING_POSTGRES_USER}:${STAGING_DB_PASSWORD}@db:5432/${STAGING_POSTGRES_DB}
      JWT_SECRET: ${STAGING_JWT_SECRET:?Set STAGING_JWT_SECRET in .env.staging}
    command: ["node", "dist/scripts/migrate.js"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - staging

  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    env_file:
      - .env.staging
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${STAGING_POSTGRES_USER}:${STAGING_DB_PASSWORD}@db:5432/${STAGING_POSTGRES_DB}
      JWT_SECRET: ${STAGING_JWT_SECRET:?Set STAGING_JWT_SECRET in .env.staging}
    command: ["node", "dist/scripts/bootstrap-ceo.js"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - staging

networks:
  staging:

volumes:
  staging_postgres_data:
